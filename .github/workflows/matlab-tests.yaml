name: Run MATLAB Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out your repository's code
      - name: Check out repository
        uses: actions/checkout@v4
        
      # 2. Install the latest version of MATLAB
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        
      # 3. Find and run all tests
      - name: Run tests
        uses: matlab-actions/run-tests@v3
        with:
          # This adds the 'src' folder to the MATLAB path before testing
          source-folder: src